openapi: 3.1.0
info:
  title: Animate Auto Tool API
  version: 1.0.0
  description: >-
    JSON contract consumed by the embedded Vue application. The legacy /api/*
    routes remain available during the 1.x compatibility window and return
    "Deprecation: true" with /api/v1 as their successor; new clients must use
    this /api/v1 contract.
servers:
  - url: /api/v1
security:
  - cookieSession: []
paths:
  /session:
    get: { security: [], operationId: getSession, responses: { "200": { $ref: "#/components/responses/Session" } } }
  /session/login:
    post:
      security: []
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /session/bootstrap:
    post:
      security: []
      operationId: createLocalBootstrapSession
      description: Creates a temporary authenticated setup session only for a direct localhost request while first-run setup is pending.
      responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /session/logout:
    post: { operationId: logout, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /session/change-password:
    post: { operationId: changePassword, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" } } }
  /session/change-username:
    post:
      operationId: changeUsername
      description: Changes the current administrator login name after verifying the current password. The active session remains valid because it is bound to the user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeUsernameInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /recovery/reset:
    post: { security: [], operationId: recoverPassword, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Error" } } }
  /setup/readiness:
    get: { operationId: getSetupReadiness, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /setup/bootstrap:
    post: { operationId: completeSetup, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /system/pick-directory:
    post: { operationId: pickDirectory, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /dashboard:
    get: { operationId: getDashboard, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: Current in-process task snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/TaskUpdate" }
  /tasks/{task_id}:
    get:
      operationId: getTask
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "200":
          description: Current task state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskUpdate" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/sync:
    post: { operationId: startSync, responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /events:
    get:
      operationId: streamEvents
      responses:
        "200": { description: Typed server-sent event stream, content: { text/event-stream: { schema: { type: string } } } }
  /subscriptions:
    get:
      operationId: listSubscriptions
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
    post:
      operationId: createSubscription
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionInput" } } } }
      responses: { "201": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" } }
  /subscriptions/refresh:
    post:
      operationId: refreshAndRepairSubscriptions
      description: Reconcile qBittorrent progress, local-library history and durable RSS candidates, then submit only genuinely missing canonical episodes. Existing failed tasks and V2/V3 candidates are not retried or upgraded automatically, and records are never deleted or archived by this action.
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "409": { $ref: "#/components/responses/Error" }
  /subscriptions/batch:
    post: { operationId: createSubscriptionsBatch, requestBody: { $ref: "#/components/requestBodies/JsonArray" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/batch-preview:
    post: { operationId: previewSubscriptionsBatch, requestBody: { $ref: "#/components/requestBodies/JsonArray" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/validate-rss:
    get: { operationId: validateSubscriptionRss, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/search:
    get: { operationId: searchMikan, parameters: [{ name: q, in: query, required: true, schema: { type: string } }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/rss-preview:
    get: { operationId: previewRss, parameters: [{ name: rss, in: query, required: true, schema: { type: string, format: uri } }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/mikan/dashboard:
    get:
      operationId: getMikanDashboard
      parameters:
        - { name: year, in: query, schema: { type: string, pattern: "^[0-9]{4}$" } }
        - { name: season, in: query, schema: { type: string, enum: [春, 夏, 秋, 冬] } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" } }
  /subscriptions/mikan/episodes:
    get:
      operationId: getMikanEpisodes
      parameters:
        - { name: mikan_id, in: query, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: subgroup_id, in: query, schema: { type: string, pattern: "^[0-9]+$" } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" } }
  /subscriptions/mikan/poster:
    get:
      operationId: getMikanPoster
      parameters:
        - { name: url, in: query, required: true, schema: { type: string, format: uri } }
        - { name: width, in: query, schema: { type: integer, minimum: 64, maximum: 1280, default: 360 } }
      responses:
        "200":
          description: Cached same-origin Mikan poster
          content: { image/jpeg: { schema: { type: string, format: binary } } }
        "400": { description: Invalid or untrusted poster URL }
        "502": { description: Mikan poster unavailable }
  /subscriptions/mikan/resolve:
    get:
      operationId: resolveMikanByBangumiSubject
      description: Search Mikan by title and verify candidates using the bgm.tv subject link on each Mikan detail page.
      parameters:
        - { name: bangumi_subject_id, in: query, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /subscriptions/mikan/subgroups:
    get:
      operationId: getMikanSubgroups
      parameters:
        - { name: mikan_id, in: query, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" } }
  /subscriptions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put: { operationId: updateSubscription, requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionInput" } } } }, responses: { "200": { $ref: "#/components/responses/Success" } } }
    delete: { operationId: deleteSubscription, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/{id}/poster:
    get:
      operationId: getSubscriptionPoster
      description: Retry a subscription poster from Mikan or the local metadata cache. The server returns image bytes and never proxies an arbitrary remote URL.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: source, in: query, required: true, schema: { type: string, enum: [mikan, local] } }
        - { name: width, in: query, schema: { type: integer, minimum: 64, maximum: 1280 } }
      responses:
        "200":
          description: Same-origin subscription poster
          content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } }
        "400": { description: Invalid subscription ID or source }
        "404": { description: Subscription not found }
        "502": { description: Requested poster source unavailable }
  /subscriptions/{id}/toggle:
    post: { operationId: toggleSubscription, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/{id}/run:
    post: { operationId: runSubscription, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /subscriptions/{id}/repair/{action}:
    post:
      operationId: repairSubscription
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: action, in: path, required: true, schema: { type: string, enum: [use-base-rss, clear-filter, reset-logs, retry-missing, recheck-stale, retry-upgrade, refresh-library] } }]
      responses: { "202": { $ref: "#/components/responses/TaskAccepted" } }
  /subscriptions/{id}/refresh-metadata:
    post: { operationId: refreshSubscriptionMetadata, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /subscriptions/{id}/source:
    post: { operationId: switchSubscriptionSource, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/{id}/history:
    get: { operationId: getSubscriptionHistory, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /subscriptions/{id}/resources:
    get:
      operationId: listSubscriptionResources
      description: Lists the durable RSS/qB/local-library reconciliation ledger for one subscription.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Resource candidates and reconciliation summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, summary]
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/SubscriptionResource" } }
                          summary: { $ref: "#/components/schemas/SubscriptionResourceSummary" }
        "404": { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/resources/{resource_id}/retry:
    post:
      operationId: retrySubscriptionResource
      description: Explicitly retries one failed, unknown or unresolved candidate. The server reuses the stored validated URL and does not accept an arbitrary download URL.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: resource_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /subscriptions/{id}/resources/{resource_id}/upgrade:
    post:
      operationId: upgradeSubscriptionResource
      description: Explicitly selects a stored V2/V3 candidate for one canonical episode. Automatic refresh never performs this switch.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: resource_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /calendar:
    get: { operationId: getCalendar, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /calendar/posters/{id}:
    get:
      operationId: getCalendarPoster
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: width, in: query, schema: { type: integer, minimum: 64, maximum: 1280, default: 360 } }
      responses:
        "200":
          description: Cached same-origin Bangumi calendar poster
          content: { image/jpeg: { schema: { type: string, format: binary } } }
        "404": { description: Poster unavailable }
  /library:
    get: { operationId: getLibrary, parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }], responses: { "200": { $ref: "#/components/responses/Paginated" } } }
  /posters/{id}:
    get:
      operationId: getPoster
      description: Returns the cached poster. Set width for a JPEG thumbnail; versioned requests receive an immutable private cache policy.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: source, in: query, schema: { type: string, enum: [bangumi, tmdb, anilist] } }
        - { name: width, in: query, schema: { type: integer, minimum: 64, maximum: 1280 } }
        - { name: v, in: query, description: Metadata version used for cache busting, schema: { type: string } }
      responses:
        "200":
          description: Poster image or resized JPEG thumbnail
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "304": { description: Cached image is still current }
        "404": { description: Poster not found }
  /library/refresh:
    post: { operationId: refreshLibrary, responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /library/metadata/{id}/refresh:
    post: { operationId: refreshMetadataItem, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /library/fix-match:
    post: { operationId: fixMetadataMatch, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /metadata/search:
    get:
      operationId: searchMetadata
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: source, in: query, schema: { type: string, enum: [bangumi, tmdb, anilist], default: bangumi } }
      responses:
        "200": { $ref: "#/components/responses/MetadataSearch" }
        "400": { $ref: "#/components/responses/Error" }
  /metadata/match-search:
    get:
      operationId: searchMetadataMatches
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [bangumi, tmdb, anilist], default: bangumi } }
        - { name: source_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: local_anime_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/MetadataMatchSearch" }
        "400": { $ref: "#/components/responses/Error" }
  /ui/background/random:
    get:
      operationId: getRandomBackground
      responses:
        "200":
          description: Same-origin poster selected for the application background
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RandomBackground" }
        "404": { $ref: "#/components/responses/Error" }
  /local-anime:
    get:
      operationId: getLocalAnime
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: q, in: query, description: Search local and metadata titles, schema: { type: string, maxLength: 200 } }
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
  /local-anime/scan:
    post: { operationId: scanLocalAnime, responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /local-anime/organize/preview:
    post:
      operationId: previewLocalAnimeOrganize
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocalOrganizePreviewInput" } } } }
      responses:
        "200":
          description: Short-lived, source-fingerprinted organization plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LocalOrganizePreview" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /local-anime/organize:
    post:
      operationId: applyLocalAnimeOrganize
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocalOrganizeApplyInput" } } } }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /local-directories:
    post: { operationId: addLocalDirectory, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /local-directories/{id}:
    delete: { operationId: deleteLocalDirectory, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /local-directories/{id}/rename-preview:
    post: { operationId: previewDirectoryRename, parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /local-directories/{id}/rename:
    post: { operationId: applyDirectoryRename, parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /local-anime/{id}/episodes:
    get: { operationId: getEpisodes, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /local-anime/{id}/files:
    get: { operationId: getLocalFiles, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /local-anime/{id}/refresh-metadata:
    post: { operationId: refreshLocalMetadata, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "202": { $ref: "#/components/responses/TaskAccepted" } } }
  /local-anime/{id}/source:
    post: { operationId: switchLocalSource, parameters: [{ $ref: "#/components/parameters/Id" }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /jellyfin/play/{id}:
    get:
      operationId: getJellyfinPlayInfo
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Resolved proxy and optional browser-direct Jellyfin playback URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JellyfinPlayInfo" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /jellyfin/stream/{id}:
    get:
      operationId: streamJellyfinEpisode
      description: Proxies a Jellyfin static stream while preserving Range requests.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "404": { description: Episode or Jellyfin item not found }
  /netbird/jellyfin/stream/{id}:
    get:
      operationId: streamJellyfinEpisodeThroughNetBird
      deprecated: true
      description: Deprecated compatibility endpoint. The current frontend no longer generates or selects the NetBird playback route.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "401": { description: "Missing, invalid, mismatched, or expired stream token" }
        "404": { description: Episode or Jellyfin item not found }
  /netbird/media/{provider}/stream/{item_id}:
    get:
      operationId: streamMediaItemThroughNetBird
      deprecated: true
      description: Deprecated compatibility endpoint. The current frontend no longer generates or selects the NetBird playback route.
      security: []
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "401": { description: "Missing, invalid, mismatched, or expired stream token" }
        "404": { description: Provider or media item not found }
  /media/providers:
    get:
      operationId: listMediaProviders
      responses:
        "200":
          description: Configured and available media providers
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaProviderList" }
  /media/providers/{provider}/libraries:
    get:
      operationId: listMediaLibraries
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
      responses:
        "200":
          description: Provider libraries with the current AnimateTool selection state
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaLibraryList" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items:
    get:
      operationId: listMediaItems
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: library_id, in: query, schema: { type: string, default: all } }
        - { name: parent_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: section, in: query, schema: { type: string, enum: [continue, favorites] } }
        - { name: sort_by, in: query, schema: { type: string, default: SortName } }
        - { name: sort_order, in: query, schema: { type: string, enum: [Ascending, Descending], default: Ascending } }
      responses:
        "200":
          description: Paginated provider-neutral media items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPageEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/continue:
    get:
      operationId: listContinueWatchingMedia
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Continue-watching items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPageEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items/{item_id}:
    get:
      operationId: getMediaItem
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      responses:
        "200":
          description: Provider-neutral media item detail
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaItem" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items/{item_id}/children:
    get:
      operationId: listMediaItemChildren
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
        - { name: type, in: query, schema: { type: string, enum: [season, episode], default: season } }
      responses:
        "200":
          description: Seasons or episodes belonging to the media item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPageEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items/{item_id}/play:
    get:
      operationId: getMediaPlayback
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      responses:
        "200":
          description: Available playback routes and current user state
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaPlaybackInfo" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items/{item_id}/image:
    get:
      operationId: getMediaItemImage
      description: Proxies the provider image without exposing provider credentials.
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      responses:
        "200":
          description: Provider image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { description: Image not found }
        "503": { description: Provider unavailable }
  /media/providers/{provider}/items/{item_id}/stream:
    get:
      operationId: streamMediaItem
      description: Proxies the provider stream while preserving Range requests.
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      responses:
        "200":
          description: Proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial proxied video stream
          content:
            video/*:
              schema: { type: string, format: binary }
        "404": { description: Provider or media item not found }
  /media/providers/{provider}/items/{item_id}/progress:
    post:
      operationId: updateMediaProgress
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaProgressInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /media/providers/{provider}/items/{item_id}/user-state:
    put:
      operationId: updateMediaUserState
      parameters:
        - { $ref: "#/components/parameters/MediaProvider" }
        - { $ref: "#/components/parameters/MediaItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUserStateInput" }
      responses:
        "200":
          description: Updated played and favorite state
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [played, favorite]
                        properties:
                          played: { type: boolean }
                          favorite: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /playback/continue:
    get:
      operationId: getContinueWatching
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 10 } }
      responses:
        "200":
          description: Per-user continue-watching list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContinueWatchingResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /playback/progress:
    post:
      operationId: reportPlaybackProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackProgressInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jellyfin/progress:
    post:
      operationId: reportJellyfinProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackProgressInput" }
      responses:
        "200": { description: Playback progress accepted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /jellyfin/episodes/{id}/user-state:
    put:
      operationId: updateJellyfinEpisodeUserState
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JellyfinUserStateInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /jellyfin/series/{id}/user-state:
    put:
      operationId: updateJellyfinSeriesUserState
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JellyfinUserStateInput" } } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /bangumi/subject/{id}/collection:
    post: { operationId: updateBangumiCollection, parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /bangumi/subject/{id}/progress:
    post: { operationId: updateBangumiProgress, parameters: [{ $ref: "#/components/parameters/Id" }], requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /diagnostics/logs/export:
    get:
      operationId: exportDiagnosticLogs
      description: Downloads a ZIP containing up to the newest three hourly server log files.
      responses:
        "200":
          description: Diagnostic log archive
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Log-File-Count: { schema: { type: integer, minimum: 1, maximum: 3 } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /diagnostics/health/export:
    get:
      operationId: exportHealthDiagnostics
      description: Downloads an issue-only health log plus redacted runtime, database, task, subscription, and media-library snapshots for developer debugging.
      responses:
        "200":
          description: Health diagnostics archive
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Health-Event-File-Count: { schema: { type: integer, minimum: 0 } }
            X-Diagnostic-Snapshot-Count: { schema: { type: integer, minimum: 1 } }
            X-Health-Logs-Consumed: { schema: { type: string, enum: ["true"] } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "500": { $ref: "#/components/responses/Error" }
  /backup:
    get: { operationId: getBackupStatus, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /backup/export:
    post:
      operationId: exportBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BackupArchivePasswordInput"
              properties:
                mode: { type: string, enum: [full, settings, cloudflare], default: full }
      responses:
        "200":
          description: AES-256 encrypted ZIP backup attachment
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
  /backup/analyze:
    post:
      operationId: analyzeBackup
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/BackupArchivePasswordInput"
              required: [backup_file]
              properties:
                backup_file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /backup/restore:
    post: { operationId: restoreBackup, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /backup/r2/list:
    get: { operationId: listR2Backups, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /backup/r2/upload:
    post:
      operationId: uploadR2Backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupArchivePasswordInput" }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
  /backup/r2/stage:
    post:
      operationId: stageR2Backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BackupArchivePasswordInput"
              required: [key]
              properties:
                key: { type: string, minLength: 1 }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
  /backup/r2/progress/{taskId}:
    get: { operationId: getR2Progress, parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }], responses: { "200": { $ref: "#/components/responses/Success" } } }
  /backup/r2/delete:
    post: { operationId: deleteR2Backup, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /backup/r2/test:
    post: { operationId: testR2, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /health:
    get: { operationId: getHealth, responses: { "200": { $ref: "#/components/responses/HealthReport" } } }
  /runtime:
    get: { operationId: getRuntime, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /audit-logs:
    get: { operationId: listAuditLogs, parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }], responses: { "200": { $ref: "#/components/responses/Paginated" } } }
  /settings:
    get: { operationId: getSettings, responses: { "200": { $ref: "#/components/responses/Success" } } }
    put: { operationId: updateSettings, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /settings/proxy/test:
    post: { operationId: testProxy, requestBody: { $ref: "#/components/requestBodies/JsonObject" }, responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } } }
  /settings/connections/{provider}:
    get:
      operationId: getConnectionStatus
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [qb, tmdb, anilist, jellyfin, bangumi, mikan] } }
        - name: source
          in: query
          required: false
          description: Jellyfin connection route to test. Only proxy and direct are accepted when provider is jellyfin.
          schema: { type: string, enum: [proxy, direct] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /settings/maintenance:
    get: { operationId: getMaintenance, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /settings/updater/releases:
    get:
      operationId: listUpdaterReleases
      description: Lists published GitHub releases for the selected manual update channel. Stable excludes prereleases; beta includes both stable and prerelease builds.
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [stable, beta], default: stable } }
      responses:
        "200": { $ref: "#/components/responses/UpdateReleaseCatalog" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /settings/updater/snapshots:
    get:
      operationId: listUpdaterSnapshots
      description: Lists local update snapshots without exposing filesystem paths.
      responses:
        "200": { $ref: "#/components/responses/UpdaterSnapshotList" }
  /settings/updater/rollback:
    post:
      operationId: restoreUpdaterSnapshot
      description: Restores a locally stored database and configuration snapshot. If a previous binary is available, the service exits and a local helper replaces the executable before readiness-checking the restored version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdaterRollbackInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "202": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/updater/{action}:
    post:
      operationId: runUpdaterAction
      description: Checks for an update or applies one. When action is apply, version can pin a published release; the server re-fetches that release and never trusts a client-supplied asset URL.
      parameters: [{ name: action, in: path, required: true, schema: { type: string, enum: [check, apply] } }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplyInput" }
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/Error" }
  /settings/ai:
    get: { operationId: getAiSettings, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /settings/ai/models:
    get:
      deprecated: true
      description: Compatibility endpoint. New clients should send provider settings in the POST request body.
      operationId: getAiModels
      parameters:
        - { name: provider, in: query, required: false, schema: { type: string, enum: [openai, gemini, claude] } }
        - { name: format, in: query, required: false, description: API format. OpenAI uses openai; Gemini and Claude default to native., schema: { type: string, enum: [native, openai] } }
        - { name: base_url, in: query, required: false, schema: { type: string } }
        - { name: model, in: query, required: false, schema: { type: string } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
    post:
      operationId: listAiModels
      description: Lists models using the unsaved provider form. If the provider is rate limited, the response can remain 200 with source=cache/fallback/configured, a warning, and a selectable cached or official fallback catalog.
      requestBody: { $ref: "#/components/requestBodies/AIProviderInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /settings/ai/test:
    post:
      operationId: testAiConnection
      description: Sends a real minimal user message containing "hi" to the selected provider without loading AnimateTool tools.
      requestBody: { $ref: "#/components/requestBodies/AIProviderInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /assistant/messages:
    get:
      operationId: getAssistantMessages
      description: Returns only the current user's displayable user messages and final assistant replies. System prompts, tool calls and tool results are excluded.
      responses:
        "200": { $ref: "#/components/responses/AssistantMessages" }
    post:
      operationId: sendAssistantMessage
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete: { operationId: clearAssistantMessages, responses: { "200": { $ref: "#/components/responses/Success" } } }
  /ai/filename-resolutions:
    post:
      operationId: requestAiFilenameResolution
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses: { "202": { $ref: "#/components/responses/AIAnalysisAccepted" }, "400": { $ref: "#/components/responses/Error" }, "412": { $ref: "#/components/responses/Error" } }
  /ai/health/analyze:
    post:
      operationId: requestAiHealthAnalysis
      responses: { "202": { $ref: "#/components/responses/AIAnalysisAccepted" }, "412": { $ref: "#/components/responses/Error" } }
  /ai/library-issues/{id}/analyze:
    post:
      operationId: requestAiLibraryIssueAnalysis
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { $ref: "#/components/responses/AIAnalysisAccepted" }, "400": { $ref: "#/components/responses/Error" }, "412": { $ref: "#/components/responses/Error" } }
  /ai/metadata/local-anime/{id}/suggest:
    post:
      operationId: requestAiMetadataSuggestion
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses: { "202": { $ref: "#/components/responses/AIAnalysisAccepted" }, "400": { $ref: "#/components/responses/Error" }, "412": { $ref: "#/components/responses/Error" } }
  /ai/subscriptions/{id}/rules/suggest:
    post:
      operationId: requestAiSubscriptionRuleSuggestion
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "202": { $ref: "#/components/responses/AIAnalysisAccepted" }, "400": { $ref: "#/components/responses/Error" }, "412": { $ref: "#/components/responses/Error" } }
  /ai/proposals/{id}:
    get:
      operationId: getAiProposal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1 } }]
      responses: { "200": { $ref: "#/components/responses/AIProposalResponse" }, "404": { $ref: "#/components/responses/Error" } }
  /ai/proposals/{id}/confirm:
    post:
      operationId: confirmAiProposal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1 } }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "409": { $ref: "#/components/responses/Error" } }
  /ai/proposals/{id}/apply:
    post:
      operationId: applyAiProposal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1 } }]
      requestBody: { $ref: "#/components/requestBodies/AIProposalApplyInput" }
      responses: { "202": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "502": { $ref: "#/components/responses/Error" } }
  /ai/proposals/{id}/dismiss:
    post:
      operationId: dismissAiProposal
      parameters: [{ name: id, in: path, required: true, schema: { type: string, minLength: 1 } }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/Error" } }
  /ai/tool-runs:
    get:
      operationId: listAiToolRuns
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses: { "200": { $ref: "#/components/responses/AIToolRuns" } }
components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: animate_session }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    MediaProvider: { name: provider, in: path, required: true, schema: { type: string, minLength: 1 } }
    MediaItemId: { name: item_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
  requestBodies:
    JsonObject: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    JsonArray: { required: true, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    AIProviderInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [provider]
            properties:
              provider: { type: string, enum: [openai, gemini, claude] }
              format: { type: string, enum: [native, openai], description: Blank uses the saved format. OpenAI only accepts openai; Gemini and Claude default to native. }
              base_url: { type: string, description: Unsaved form value; blank uses the saved provider value. }
              api_key: { type: string, format: password, description: Unsaved form value; blank uses the saved provider key. }
              model: { type: string, description: Unsaved form value; blank uses the saved provider value. }
    AIProposalApplyInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmation_token]
            properties:
              confirmation_token: { type: string, minLength: 1, description: One-time token returned by the confirm endpoint. }
  responses:
    Success: { description: Successful response, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    HealthReport:
      description: Current health counters and actionable summary
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/HealthReport" }
    Session:
      description: Current browser session and local-only capability state
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionState" }
    Paginated: { description: Paginated successful response, content: { application/json: { schema: { $ref: "#/components/schemas/PaginatedEnvelope" } } } }
    TaskAccepted: { description: Background task accepted, content: { application/json: { schema: { $ref: "#/components/schemas/TaskEnvelope" } } } }
    UpdateReleaseCatalog:
      description: Releases visible in the selected manual update channel
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/UpdateReleaseCatalog" }
    UpdaterSnapshotList:
      description: Local update snapshots
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/UpdaterSnapshotList" }
