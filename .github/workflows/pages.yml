name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-link-definitions.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".lychee.toml"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-link-definitions.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".lychee.toml"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate OpenAPI document
        run: python -m openapi_spec_validator docs/openapi.yaml

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            README.md
            docs/**/*.md
            docs-link-definitions.md
          fail: true

      - name: Check generated files are not tracked
        run: git diff --exit-code -- build/docs-site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/docs-site

  deploy:
    name: Publish documentation
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
