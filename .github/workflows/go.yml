name: Go CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build and test frontend
        run: |
          npm --prefix web/frontend ci
          npm audit --prefix web/frontend --audit-level=moderate
          npm --prefix web/frontend run generate:types
          npm --prefix web/frontend run test:run
          npm --prefix web/frontend run build
          git diff --exit-code -- web/dist web/frontend/src/api/schema.d.ts

      - name: Read build version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          CGO_ENABLED: 0
        run: go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --timeout=5m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  package-e2e:
    name: Packaged Binary E2E (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Read package version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Build Linux release archive
        env:
          PACKAGE_TARGETS: linux/amd64,windows/amd64
          PACKAGE_INCLUDE_ARCHIVES: "1"
          PACKAGE_INCLUDE_WINDOWS_STANDALONE: "0"
          PACKAGE_INCLUDE_DMG: "0"
        run: bash ./scripts/package.sh "$APP_VERSION"

      - name: Upload Windows package for E2E
        uses: actions/upload-artifact@v4
        with:
          name: package-e2e-windows
          path: dist/AnimateAutoTool_${{ env.APP_VERSION }}_windows_amd64.zip
          if-no-files-found: error
          retention-days: 1

      - name: Install headless Chromium
        run: npm --prefix web/frontend exec -- playwright install --with-deps chromium

      - name: Test packaged binary
        env:
          PACKAGE_E2E_INSTALL_BROWSER: "0"
          PACKAGE_E2E_ARTIFACT: dist/AnimateAutoTool_${{ env.APP_VERSION }}_linux_amd64.tar.gz
          PACKAGE_E2E_VERSION: ${{ env.APP_VERSION }}
        run: bash ./scripts/test-package-e2e.sh

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-e2e-diagnostics-${{ env.APP_VERSION }}
          path: |
            web/frontend/playwright-report/
            web/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-e2e-windows:
    name: Packaged Binary E2E (Windows)
    needs: package-e2e
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Read package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: package-e2e-windows
          path: dist

      - name: Install frontend dependencies
        run: npm.cmd --prefix web/frontend ci

      - name: Install Chromium
        run: npm.cmd --prefix web/frontend exec -- playwright install chromium

      - name: Test packaged Windows binary
        env:
          PACKAGE_E2E_ARTIFACT: dist/AnimateAutoTool_${{ env.APP_VERSION }}_windows_amd64.zip
          PACKAGE_E2E_VERSION: ${{ env.APP_VERSION }}
          PACKAGE_E2E_INSTALL_BROWSER: "0"
        run: ./scripts/test-package-e2e-windows.ps1

      - name: Upload Windows E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-e2e-windows-diagnostics-${{ env.APP_VERSION }}
          path: |
            web/frontend/playwright-report/
            web/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package Archives
    needs: [test, package-e2e, package-e2e-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Read package version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Build versioned packages
        run: bash ./scripts/package.sh "$APP_VERSION"

      - name: Upload packaged archives
        uses: actions/upload-artifact@v4
        with:
          name: animate-packages-${{ env.APP_VERSION }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/animate-release-manifest.json
          retention-days: 7

  package-dmg:
    name: Package macOS DMG
    needs: [test, package-e2e, package-e2e-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Read package version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Build DMG packages
        env:
          PACKAGE_TARGETS: darwin/amd64,darwin/arm64
          PACKAGE_INCLUDE_ARCHIVES: "0"
          PACKAGE_INCLUDE_WINDOWS_STANDALONE: "0"
          PACKAGE_INCLUDE_DMG: "1"
        run: bash ./scripts/package.sh "$APP_VERSION"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animate-dmg-${{ env.APP_VERSION }}
          path: dist/*.dmg
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - package
      - package-dmg
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read release version
        run: echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        run: |
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 * > SHA256SUMS.txt
          else
            sha256sum * > SHA256SUMS.txt
          fi

      - name: Validate updater release assets
        run: DIST_DIR=./dist bash ./scripts/check_release_assets.sh "$APP_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: ${{ env.APP_VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/animate-release-manifest.json
            dist/SHA256SUMS.txt
